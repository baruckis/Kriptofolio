// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    // The plugins are applied in the app module; only their versions are declared here.
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    // Not applied: AGP 9 builds Kotlin itself. Declaring it sets the Kotlin Gradle plugin version.
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.parcelize) apply false
    alias(libs.plugins.android.legacy.kapt) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.oss.licenses) apply false

    // NOTE: Do not place your application dependencies here; they belong
    // in the individual module build.gradle files
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}