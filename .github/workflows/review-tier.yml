# Labels every pull request with its review tier, decided by the paths it changes.
#
# CONTRIBUTING.md, step 5, says what each tier needs before merge. In short: "review: docs" needs
# no independent review, "review: rules" and "review: code" do. This file holds the
# authoritative path lists; the label only makes the result visible, and a label added by hand
# never lowers what the paths require.
#
# Why pull_request_target: a pull request from a fork gets a read-only token under
# pull_request, so it could not be labelled. pull_request_target runs this file as it is on the
# target branch, with a token that may write labels. That is safe here only because nothing from
# the pull request is checked out or executed: the job reads the list of changed file names
# through the API and nothing else. Keep it that way; never add actions/checkout of the head.

name: review tier

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# Reading the pull request's files and writing its labels; nothing else.
permissions:
  pull-requests: write

concurrency:
  group: review-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA, with the version it corresponds to in the comment.
      - name: Classify changed paths and set the label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Files that instruct people and agents, or define the behaviour contract and the plan.
            const RULE_FILES = new Set([
              'RELEASING.md', 'UPGRADE-NOTES.md', 'SUPPORT.md', 'renovate.json',
              'docs/roadmap.md', 'docs/execution-plan.md', 'docs/BEHAVIOUR.md', 'docs/behaviour-parity.md',
              'docs/ui-inventory.md',
            ]);
            // Agent instructions, contribution rules and licenses at any depth, in any letter case. A
            // new agent file name joins this list and CONTRIBUTING.md step 5 in the same pull request.
            const RULE_NAMES = new Set([
              'agents.md', 'claude.md', 'contributing.md', 'license', 'license.md', 'license.txt',
            ]);
            const RULE_DIRS = ['config/', 'docs/decisions/', 'docs/ui-evidence/', '.github/', '.claude/'];
            // Documentation that is not a rule: Markdown in the repository root, docs/ and store
            // listing texts and images. Markdown anywhere else (an app resource, a test fixture) is code.
            const DOC_DIRS = ['docs/', 'fastlane/metadata/'];

            const tierOf = (path) => {
              const name = path.split('/').pop().toLowerCase();
              if (RULE_FILES.has(path) || RULE_NAMES.has(name) || RULE_DIRS.some((d) => path.startsWith(d))) {
                return 'rules';
              }
              const rootMarkdown = !path.includes('/') && path.endsWith('.md');
              if (rootMarkdown || DOC_DIRS.some((d) => path.startsWith(d))) return 'docs';
              return 'code';
            };

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100,
            });
            // A rename counts for both its old and its new path.
            const paths = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));
            const tiers = new Set(paths.map(tierOf));
            // The API returns at most 3,000 files. If the list is shorter than the pull request,
            // unseen files could be code, so the tier fails closed.
            const truncated = files.length < context.payload.pull_request.changed_files;
            const tier = truncated || tiers.has('code') ? 'code' : tiers.has('rules') ? 'rules' : 'docs';

            const labels = ['review: docs', 'review: rules', 'review: code'];
            const wanted = `review: ${tier}`;
            // Reconcile against the labels as they are now, not the event's snapshot.
            const live = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const current = live.map((l) => l.name);
            for (const name of current.filter((n) => labels.includes(n) && n !== wanted)) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
              } catch (error) {
                if (error.status !== 404) throw error; // Already removed by someone else.
              }
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [wanted] });
            }

            const needs = tier === 'docs'
              ? 'No independent review; links and facts checked, the owner reads it before merging.'
              : 'Independent review of the exact HEAD (CONTRIBUTING.md, step 5).';
            const note = truncated
              ? `Only ${files.length} of ${context.payload.pull_request.changed_files} changed files could be listed, so the tier is code.\n\n`
              : '';
            await core.summary
              .addHeading(`Review tier: ${tier}`, 3)
              .addRaw(`${needs}\n\n${note}`)
              .addList(paths.map((p) => `${tierOf(p)}: ${p}`))
              .write();
