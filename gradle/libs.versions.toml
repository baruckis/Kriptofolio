# Single source of truth for dependency, plugin and SDK versions (replaces the former versions.gradle).
# Reasons follow a pinned version only where versions.gradle or UPGRADE-NOTES.md records one;
# the remaining versions are simply the 2018-2020 era values the app has always declared.

[versions]
# Sdk and tools
compile-sdk = "36"
min-sdk = "21"
target-sdk = "36"

# AGP 9 builds Kotlin itself; the kotlin version below replaces the Kotlin Gradle plugin it would bring
# (2.2.10). Data binding, Jetifier and the kapt-based Dagger still work on it (UPGRADE-NOTES.md, section 11).
agp = "9.4.1"
kotlin = "2.4.21"
# Room and Glide run on KSP; KSP versions are independent of the Kotlin version since 2.3.0.
ksp = "2.3.12"
# Kapt-based Dagger; dagger-android is deprecated upstream, replaced by Koin in 1.3.0 (ADR-005).
dagger = "2.23.2"

# App dependencies
app-compat = "1.1.0"
arch-core = "2.1.0"
browser = "1.2.0"
cardview = "1.0.0"
# A 2019 beta, kept as declared.
constraint-layout = "2.0.0-beta4"
coroutines = "1.0.1"
design = "1.0.0"
# Alpha, kept as declared.
espresso = "3.3.0-alpha03"
# Used by the vendored flipview module; the lowest version that has all the annotations it imports.
annotation = "1.2.0"
# The first Glide 4 line with a KSP processor is 4.14; 4.16.0 is the last 4.x release.
glide = "4.16.0"
# Test dependency.
junit = "4.13"
ktx = "1.16.0"
# Oldest release that applies on AGP 9; 0.10.6 still used the removed applicationVariants API.
oss-licenses-plugin = "0.10.8"
# Declared 2.2.0-rc03, but the data binding runtime constraints resolve it to 2.6.2 (UPGRADE-NOTES.md).
lifecycle = "2.2.0-rc03"
# Oldest release whose Byte Buddy can mock on JDK 25; 5.17.0 cannot (UPGRADE-NOTES.md, section 11).
mockito = "5.18.0"
# Pre-AndroidX group name, only works through Jetifier (UPGRADE-NOTES.md).
navigation = "1.0.0"
okhttp = "4.3.1"
oss-licenses = "17.0.1"
preference = "1.1.0"
# Alpha, kept as declared.
recyclerview = "1.2.0-alpha01"
# Beta, kept as declared.
recyclerview-selection = "1.1.0-beta01"
retrofit = "2.7.1"
# Last release before Room KMP, which the Room KMP step adopts. 2.3.0 to 2.6.0 also compile on KSP here.
room = "2.6.1"
# Alpha, kept as declared.
rules = "1.3.0-alpha03"
# Alpha, kept as declared.
runner = "1.3.0-alpha03"
# Only for the characterization tests that open recorded database files on the JVM.
sqlite-jdbc = "3.49.1.0"
stetho = "1.5.1"

[libraries]
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "app-compat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-recyclerview-selection = { module = "androidx.recyclerview:recyclerview-selection", version.ref = "recyclerview-selection" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraint-layout" }
material = { module = "com.google.android.material:material", version.ref = "design" }
androidx-lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycle" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
navigation-fragment-ktx = { module = "android.arch.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { module = "android.arch.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-android = { module = "com.google.dagger:dagger-android", version.ref = "dagger" }
dagger-android-support = { module = "com.google.dagger:dagger-android-support", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
dagger-android-processor = { module = "com.google.dagger:dagger-android-processor", version.ref = "dagger" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-ksp = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" }
glide-okhttp3-integration = { module = "com.github.bumptech.glide:okhttp3-integration", version.ref = "glide" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
stetho = { module = "com.facebook.stetho:stetho", version.ref = "stetho" }
play-services-oss-licenses = { module = "com.google.android.gms:play-services-oss-licenses", version.ref = "oss-licenses" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "rules" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "arch-core" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
oss-licenses = { id = "com.google.android.gms.oss-licenses-plugin", version.ref = "oss-licenses-plugin" }
